<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختبارات رفيق التثبيت v7.2</title>
  <style>
    body { font-family: 'Cairo', Tahoma, sans-serif; background: #00112B; color: #F7F8FA; padding: 20px; max-width: 780px; margin: 0 auto; line-height: 1.7; }
    h1 { color: #EFC879; margin-top: 0; font-size: 1.35rem; }
    .test-row { padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.14); background: #071C3B; display: flex; justify-content: space-between; gap: 10px; }
    .pass { border-color: #45D99D; color: #45D99D; }
    .fail { border-color: #FF7B89; color: #FF7B89; }
    .summary { padding: 14px; border-radius: 12px; font-weight: 800; margin-bottom: 16px; background: rgba(208,161,81,0.15); border: 1px solid #D0A151; }
  </style>
</head>
<body>
  <h1>🧪 اختبارات معايير القبول — رفيق التثبيت v7.2</h1>
  <div id="summary" class="summary">جارٍ تشغيل الاختبارات...</div>
  <div id="results"></div>

  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="storage.js"></script>
  <script>
    const tests = [];
    function test(name, fn) { tests.push({ name, fn }); }
    function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }

    test('١. دقة المصحف: ١١٤ سورة، ٣٠ جزءاً، ٦٢٣٦ آية، ٦٠٤ وجهاً بدون عدّ مزدوج', () => {
      assert(SURAHS_DB.length === 114, 'عدد السور 114');
      assert(JUZ_DB.length === 30, 'عدد الأجزاء 30');
      const totalAyahs = SURAHS_DB.reduce((a, s) => a + s.ayahs, 0);
      assert(totalAyahs === 6236, `مجموع الآيات ${totalAyahs}`);
      let grand = 0;
      JUZ_DB.forEach((j) => {
        const s = getJuzSurahs(j.num).reduce((a, x) => a + getSurahPagesInJuz(x, j), 0);
        assert(Math.abs(s - j.totalPages) < 0.01, `الجزء ${j.num}: ${s} بدل ${j.totalPages}`);
        grand += s;
      });
      assert(Math.abs(grand - 604) < 0.01, `الإجمالي ${grand}`);
    });

    test('٢. التاريخ المحلي عند 00:30 لا ينحرف بتوقيت UTC', () => {
      assert(formatLocalDate(new Date(2026, 0, 15, 0, 30, 0)) === '2026-01-15', 'شتاء');
      assert(formatLocalDate(new Date(2026, 6, 15, 0, 30, 0)) === '2026-07-15', 'صيف');
      assert(addDaysStr('2026-01-31', 1) === '2026-02-01', 'نهاية الشهر');
    });

    test('٣. محرك SM-2-lite: تصاعد «جيد» + خطوات التعلّم [1,3,7] + السقف حسب المستوى', () => {
      let m = { intervalDays: 1, ease: 2.3, reps: 0, hasUrgent: true };
      const seq = [];
      for (let i = 0; i < 8; i++) { m = computeSM2(m, 'جيد', 0, 'hafidh'); seq.push(m.intervalDays); }
      assert(JSON.stringify(seq) === JSON.stringify([2, 3, 4, 5, 7, 9, 12, 16]), `تسلسل جيد: ${seq}`);
      assert(m.hasUrgent === false, 'إنهاء hasUrgent');
      assert(computeSM2({ intervalDays: 20, ease: 2.8, reps: 5 }, 'ممتاز', 0, 'beginner').intervalDays === 14, 'سقف المبتدئ 14');
      assert(computeSM2({ intervalDays: 40, ease: 2.8, reps: 5 }, 'ممتاز', 0, 'intermediate').intervalDays === 30, 'سقف المتوسط 30');
      assert(computeSM2({ intervalDays: 60, ease: 2.8, reps: 5 }, 'ممتاز', 0, 'hafidh').intervalDays === 45, 'سقف الحافظ 45');
    });

    test('٤. ميزانية الوقت اليومية <= dailyMin لكل الأوقات {10..90}', () => {
      [10, 15, 20, 30, 45, 60, 90].forEach((dailyMin) => {
        const prof = { mode: 'both', level: 'intermediate', dailyMin, maqraaDays: [1, 3, 5], direction: 'from_nas', newPagesPerSession: 1, revPagesPerDay: 5, diagnosedMemorized: [30, 29] };
        const plan = buildPersonalizedPlan(prof);
        const sched = buildLiveSchedule(prof, plan.juzList, plan.activeRevJuz, plan.activeNewSurah, null, { dueSolidCount: 2, activeGroupsCount: 1 });
        sched.forEach((d) => {
          const sum = d.tasks.reduce((a, t) => a + (Number(t.mins) || 0), 0);
          assert(sum <= dailyMin, `dailyMin=${dailyMin} sum=${sum}`);
        });
      });
    });

    test('٥. حساب الأوجه تلقائياً من الآيات وتوزيع السورة عبر الأجزاء', () => {
      const p = estimatePagesFromAyahs(10, 1, 55);
      assert(p > 6 && p < 7.5, `نصف يونس: ${p}`);
      assert(getSurahJuzForLoggedPages(2, 22) === 2, 'انتقال البقرة للجزء 2');
    });

    test('٦. الترحيل الآمن من v6 إلى v7.2 دون مضاعفة loggedPages', () => {
      const v6 = { version: 6, profile: { name: 'تجربة', mode: 'both', dailyMin: 30 }, juzList: [{ num: 30, name: 'الجزء 30', range: 'النبأ - الناس', totalPages: 23, donePages: 10, completedSurahs: [78], status: 'active' }] };
      const res = migrateState(v6);
      const j30 = res.juzList.find(j => j.num === 30);
      assert(Math.abs(j30.donePages - 10) < 0.2, `donePages=${j30.donePages}`);
    });

    let passed = 0;
    const out = tests.map((t) => {
      try {
        t.fn();
        passed++;
        return `<div class="test-row pass"><span>✓ ${t.name}</span><strong>ناجح</strong></div>`;
      } catch (e) {
        return `<div class="test-row fail"><span>✕ ${t.name}: ${e.message}</span><strong>فشل</strong></div>`;
      }
    }).join('');
    document.getElementById('results').innerHTML = out;
    document.getElementById('summary').textContent = `النتيجة: اجتاز ${passed} من ${tests.length} اختباراً بنجاح.`;
  </script>
</body>
</html>
